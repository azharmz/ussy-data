<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USSY Data Control</title>
<style>
:root{--bg:#0a0f0c;--s:#101612;--r:#141c17;--b:#263229;--t:#e6ede8;--m:#8fa197;--g:#35d18f;--a:#e0a341;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:20px}.top{position:sticky;top:0;background:#0a0f0cee;border-bottom:1px solid var(--b);z-index:2}.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:14px;padding-bottom:14px}h1{font-size:18px;margin:0}h2{font-size:13px;color:var(--m);margin:24px 0 9px}.pill,.btn,input,select{border:1px solid var(--b);background:var(--s);color:var(--t);border-radius:6px;padding:7px 10px}.pill{font:12px var(--mono);color:var(--g)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid var(--b);background:var(--s);border-radius:8px;padding:14px}.value{font:600 22px var(--mono)}.label,.muted{color:var(--m);font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.controls input{min-width:180px;flex:1}.table{overflow:auto;border:1px solid var(--b);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:9px 10px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{background:var(--r);color:var(--m);font-size:12px;cursor:pointer}td:first-child{font:600 13px var(--mono)}.num{text-align:right;font-family:var(--mono)}button{cursor:pointer}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.err{color:var(--a);padding:10px 0}.bar{height:6px;background:var(--b);border-radius:9px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--g)}@media(max-width:650px){.wrap{padding:14px}.top .wrap{align-items:flex-start;gap:8px}.controls>*{flex:1 1 45%}}
</style></head><body>
<header class="top"><div class="wrap"><div><h1>USSY Data Control</h1><div class="muted">R2 source of truth · D1 serving index</div></div><button id="refresh" class="pill">Refresh</button></div></header>
<main class="wrap"><div id="error" class="err"></div>
<h2>Overview</h2><div class="grid">
<div class="card"><div class="value" id="uCount">—</div><div class="label">Universe</div></div>
<div class="card"><div class="value" id="fCount">—</div><div class="label">Fundamentals</div></div>
<div class="card"><div class="value" id="coverage">—</div><div class="label">Fundamental coverage</div><div class="bar"><div id="coverageBar" class="fill"></div></div></div>
<div class="card"><div class="value" id="serving">—</div><div class="label">Serving state</div></div>
</div>
<h2>Stock Explorer</h2>
<div class="controls">
<input id="q" type="search" placeholder="Ticker or company">
<select id="status"><option value="">All fundamental statuses</option><option>PASS_FULL</option><option>PASS_3Y_FALLBACK</option><option>FAIL_PRODUCTION_COVERAGE</option></select>
<input id="eps" type="number" step="0.01" placeholder="Min EPS YoY">
<input id="rev" type="number" step="0.01" placeholder="Min revenue YoY">
<select id="sort"><option value="ticker">Ticker</option><option value="eps_yoy_latest">EPS YoY</option><option value="revenue_yoy_latest">Revenue YoY</option><option value="annual_eps_growth">Annual EPS growth</option><option value="fundamental_as_of">Fundamental as-of</option></select>
<select id="order"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
<button id="apply" class="btn">Apply</button>
</div>
<div class="muted" id="resultMeta">Loading…</div>
<div class="table"><table><thead><tr><th data-sort="ticker">Ticker</th><th>Company</th><th>Status</th><th data-sort="eps_yoy_latest">EPS YoY</th><th>Prior EPS</th><th data-sort="revenue_yoy_latest">Revenue YoY</th><th>Prior Rev</th><th data-sort="annual_eps_growth">Annual EPS</th><th>As-of</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button id="prev" class="btn">Previous</button><span class="muted" id="pageMeta"></span><button id="next" class="btn">Next</button></div>
<h2>R2 Storage Monitor</h2><div class="grid"><div class="card"><div class="value" id="r2Objects">—</div><div class="label">Objects</div></div><div class="card"><div class="value" id="r2Size">—</div><div class="label">Storage</div></div><div class="card"><div class="value" id="r2Checked">—</div><div class="label">Checked</div></div></div>
<div class="table" style="margin-top:10px"><table style="min-width:500px"><thead><tr><th>Prefix</th><th class="num">Objects</th><th class="num">Size</th></tr></thead><tbody id="prefixes"></tbody></table></div>
</main><script>
const $=id=>document.getElementById(id); let page=1,limit=50,total=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const pct=v=>v==null?"—":(Number(v)*100).toFixed(1)+"%"; const num=v=>Number(v||0).toLocaleString(); const bytes=v=>v>=1073741824?(v/1073741824).toFixed(2)+" GiB":v>=1048576?(v/1048576).toFixed(1)+" MiB":num(v)+" B";
async function j(url){const r=await fetch(url,{cache:"no-store"});const x=await r.json();if(!r.ok)throw new Error(x.detail||x.error||("HTTP "+r.status));return x}
async function status(){const x=await j("/api/serving-status");$("uCount").textContent=num(x.universe?.row_count);$("fCount").textContent=num(x.fundamentals?.row_count);const c=x.universe?.row_count?x.fundamentals?.row_count/x.universe.row_count:0;$("coverage").textContent=pct(c);$("coverageBar").style.width=Math.min(100,c*100)+"%";$("serving").textContent=(x.universe?.status==="READY"&&x.fundamentals?.status==="READY")?"READY":"DEGRADED"}
async function stocks(){const p=new URLSearchParams({page,limit,sort:$("sort").value,order:$("order").value});if($("q").value.trim())p.set("q",$("q").value.trim());if($("status").value)p.set("fundamental_status",$("status").value);if($("eps").value)p.set("eps_yoy_min",$("eps").value);if($("rev").value)p.set("revenue_yoy_min",$("rev").value);const x=await j("/api/stocks?"+p);total=Number(x.total);$("resultMeta").textContent=num(total)+" stocks";$("pageMeta").textContent="Page "+page+" / "+Math.max(1,Math.ceil(total/limit));$("prev").disabled=page<=1;$("next").disabled=page*limit>=total;$("rows").innerHTML=(x.rows||[]).map(r=>`<tr><td>${esc(r.ticker)}</td><td>${esc(r.company_name||"—")}</td><td>${esc(r.fundamental_status||"—")}</td><td class="num">${pct(r.eps_yoy_latest)}</td><td class="num">${pct(r.eps_yoy_prior)}</td><td class="num">${pct(r.revenue_yoy_latest)}</td><td class="num">${pct(r.revenue_yoy_prior)}</td><td class="num">${pct(r.annual_eps_growth)}</td><td>${esc((r.fundamental_as_of||"—").slice(0,10))}</td></tr>`).join("")}
async function r2(){const x=await j("/api/r2-usage");$("r2Objects").textContent=num(x.total_objects);$("r2Size").textContent=bytes(x.total_bytes);$("r2Checked").textContent=new Date(x.checked_at).toLocaleString();$("prefixes").innerHTML=(x.prefixes||[]).map(r=>`<tr><td>${esc(r.prefix)}</td><td class="num">${num(r.objects)}</td><td class="num">${bytes(r.bytes)}</td></tr>`).join("")}
async function all(){try{$("error").textContent="";await Promise.all([status(),stocks(),r2()])}catch(e){$("error").textContent=e.message}}
$("apply").onclick=()=>{page=1;stocks().catch(e=>$("error").textContent=e.message)};$("prev").onclick=()=>{page--;stocks()};$("next").onclick=()=>{page++;stocks()};$("refresh").onclick=all;
document.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{$("sort").value=th.dataset.sort;$("order").value=$("order").value==="asc"?"desc":"asc";page=1;stocks()});all();
</script></body></html>
