name: Propagate Sep22 canonical repair
on:
  push:
    branches: [main]
    paths:
      - "src/rebuild_rolling_from_canonical.py"
      - ".github/workflows/propagate-sep22-repair.yml"
permissions:
  contents: read
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"
jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python src/rebuild_rolling_from_canonical.py
  ready:
    needs: rolling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python src/export_ready.py
  ema:
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python src/publish_ema_state.py
      - run: python src/verify_ema_equivalence.py --sample-size 50
  downstream:
    needs: ema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python src/audit_screening_freshness.py --snapshot-date current
      - run: python src/production_completion.py --write
