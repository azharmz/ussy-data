name: Sep22 Yahoo raw re-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/audit_sep22_yahoo_raw.py"
      - ".github/workflows/audit-sep22-yahoo-raw.yml"

permissions:
  contents: read

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Re-audit frozen 1066 population against raw Yahoo
        run: python src/audit_sep22_yahoo_raw.py
