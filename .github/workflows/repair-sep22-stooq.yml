name: One-off Sep22 Stooq recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: AUDIT or APPLY
        required: true
        type: choice
        options:
          - AUDIT
          - APPLY
        default: AUDIT
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-sep22-stooq.yml"
      - "src/repair_sep22_from_stooq.py"

permissions:
  contents: read

concurrency:
  group: sep22-stooq-recovery
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit exact incident population and Stooq coverage
        run: python src/repair_sep22_from_stooq.py
      - name: Replace 1061 verified Sep-22 bars from Stooq staging
        if: (github.event_name == 'push' && github.event.head_commit.message == 'apply frozen Sep22 Stooq repair') || inputs.mode == 'APPLY'
        run: python src/repair_sep22_from_stooq.py --apply
