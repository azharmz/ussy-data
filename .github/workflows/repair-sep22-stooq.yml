name: One-off Sep22 Stooq recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: AUDIT first; APPLY only after audit reports exactly 1066/1066
        required: true
        type: choice
        options:
          - AUDIT
          - APPLY
        default: AUDIT

permissions:
  contents: read

concurrency:
  group: sep22-stooq-recovery
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit exact incident population and Stooq coverage
        if: inputs.mode == 'AUDIT'
        run: python src/repair_sep22_from_stooq.py
      - name: Replace exactly 1066 Sep-22 bars from verified Stooq staging
        if: inputs.mode == 'APPLY'
        run: python src/repair_sep22_from_stooq.py --apply
