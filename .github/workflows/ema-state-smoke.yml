name: EMA state smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ema-state-smoke.yml'
      - 'src/ema_state.py'
      - 'src/ema_promotion.py'
      - 'src/load_ema_state.py'
      - 'src/publish_ema_state.py'
      - 'src/verify_ema_equivalence.py'
      - 'tests/test_ema_state.py'
      - 'tests/test_ema_loader.py'
      - 'tests/test_ema_promotion.py'
      - 'docs/EMA-STATE.md'

permissions:
  contents: read

concurrency:
  group: ema-state-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # Full-suite gate protects shared repo contracts before any R2 EMA write.
      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build non-production EMA candidate from existing ready/history
        run: python src/publish_ema_state.py

      - name: Equivalence gate and promote pointer last
        run: python src/verify_ema_equivalence.py --all-if-bootstrap --sample-size 50
