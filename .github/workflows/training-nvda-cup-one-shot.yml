name: Training NVDA cup morphology one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/training-nvda-cup-one-shot.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -q -r requirements.txt
      - run: |
          git clone -q https://github.com/azharmz/ussy-oneil-patterns.git /tmp/oneil
          git -C /tmp/oneil checkout -q c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - name: Find first pedagogical recognized NVDA cup
        env: {PYTHONPATH: '/tmp/oneil/src'}
        run: |
          python - <<'PY'
          import io,json,os
          import boto3,pandas as pd
          from botocore.config import Config
          from oneil_patterns.landmarks.excursion import extract_excursion_landmarks
          from oneil_patterns.landmarks.confirmed_window import extract_confirmed_window_landmarks
          from oneil_patterns.landmarks.fusion import fuse_landmark_sources
          from oneil_patterns.segmentation.segmenter import segment_base_candidates
          from oneil_patterns.validation.structural_assembly import assemble_multiturn_segments
          from oneil_patterns.morphology.cup_body import build_cup_body_geometry
          from oneil_patterns.morphology.cup_body_detector import assess_cup_body,CupBodyState
          s3=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",config=Config(retries={"max_attempts":5,"mode":"adaptive"})); b=os.environ["R2_BUCKET_NAME"]
          cur=json.loads(s3.get_object(Bucket=b,Key="universe/current.json")["Body"].read()); snap=cur["snapshot_date"]
          mem=json.loads(s3.get_object(Bucket=b,Key=f"universe/membership/{snap}.json")["Body"].read())["records"]; hit=[x for x in mem if str(x.get("ticker","")).upper()=="NVDA"][0]; sid=str(hit["security_id"])
          f=pd.read_parquet(io.BytesIO(s3.get_object(Bucket=b,Key=f"history/ohlcv/{sid}.parquet")["Body"].read())).sort_values("date").reset_index(drop=True); f["date"]=pd.to_datetime(f["date"])
          end=f.date.max(); w=f[f.date>=end-pd.DateOffset(years=3)].reset_index(drop=True); asof=w.date.max().date()
          p=extract_excursion_landmarks(w); a=extract_confirmed_window_landmarks(w); lm=fuse_landmark_sources(w,p,a); lm=[x for x in lm if x.confirmed_date<=asof]
          segs=segment_base_candidates(w,lm,asof_date=asof)+assemble_multiturn_segments(w,lm,asof_date=asof)
          uniq={}; 
          for s in segs: uniq[(s.start.price_date,s.trough.price_date,s.recovery.price_date if s.recovery else None)]=s
          rows=[]
          for s in uniq.values():
            if not s.recovery: continue
            g=build_cup_body_geometry(w,s.start,s.trough,s.recovery); z=assess_cup_body(g)
            if z.state==CupBodyState.RECOGNIZED:
              rows.append({"left_rim":str(g.left_rim.price_date),"left_rim_price":g.left_rim.price,"cup_low":str(g.trough.price_date),"cup_low_price":g.trough.price,"right_rim":str(g.right_rim.price_date),"right_rim_price":g.right_rim.price,"duration_sessions":g.duration_sessions,"depth_pct":g.depth_pct,"right_rim_ratio":g.right_rim_to_left_rim_ratio,"bottom5_sessions":g.sessions_within_5pct_of_trough,"bottom10_sessions":g.sessions_within_10pct_of_trough,"bottom10_max_run":g.max_bottom_run_10pct,"confirmed_date":str(g.confirmed_date),"faults":[x.value for x in z.faults]})
          rows.sort(key=lambda x:(x["right_rim"],x["left_rim"]))
          print("RECOGNIZED_COUNT",len(rows))
          # Prefer earliest recognized cup ending 2024+ for easy chart training
          for x in rows[:30]: print(json.dumps(x))
          PY
