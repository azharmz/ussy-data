name: R2 connection test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/r2-connection-test.yml

permissions:
  contents: read

jobs:
  upload-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      OBJECT_KEY: connection-tests/github-actions-${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Create test file
        shell: bash
        run: |
          printf 'USSY R2 connection test\nrun_id=%s\nrun_attempt=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > r2-connection-test.txt

      - name: Upload test file to R2
        shell: bash
        run: |
          aws s3 cp r2-connection-test.txt \
            "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

      - name: Verify object exists in R2
        shell: bash
        run: |
          aws s3api head-object \
            --bucket "${R2_BUCKET_NAME}" \
            --key "${OBJECT_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query '{ContentLength:ContentLength,ETag:ETag}' \
            --output json
          echo "Verified R2 object: ${OBJECT_KEY}"

