name: Oneil P8 DEVELOPMENT execution host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p8-oneil-development-host.yml'

permissions:
  contents: read

jobs:
  p8-development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out canonical Oneil engine
        uses: actions/checkout@v4
        with:
          repository: azharmz/ussy-oneil-patterns
          ref: 3b6cb88a94062df3a6d0a30ca69ee87c85ee7e3d
          path: oneil-patterns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: oneil-patterns/pyproject.toml

      - name: Install canonical validation dependencies
        working-directory: oneil-patterns
        run: python -m pip install -e ".[validation]"

      - name: Run canonical P8 DEVELOPMENT validation
        working-directory: oneil-patterns
        run: python scripts/run_p8_development.py

      - name: Upload canonical P8 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-canonical-development
          path: oneil-patterns/results/p8-canonical-development.json
          if-no-files-found: warn
