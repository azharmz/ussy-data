name: Repair 34 reported OHLC bars

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Back up, refetch 34 bars, repair and verify ready
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PYTHONUNBUFFERED: '1'
        run: python src/repair_reported_bars.py
      - name: Save evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ohlcv-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/repair-bars/
          retention-days: 30
          if-no-files-found: warn
