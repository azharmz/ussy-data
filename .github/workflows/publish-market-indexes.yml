name: Production market indexes
on:
  workflow_dispatch:
  schedule:
    # Weekdays after the production OHLCV refresh; publishes the latest completed US session.
    - cron: "20 4 * * 1-5"
  push:
    branches: [main]
    paths:
      - 'src/publish_market_indexes.py'
      - '.github/workflows/publish-market-indexes.yml'
permissions:
  contents: read
concurrency:
  group: production-market-indexes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Publish immutable market-index run and official pointer
        run: python src/publish_market_indexes.py --period 2y
