name: Production EMA resume

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests before consuming READY checkpoint
        run: python -m unittest discover -s tests

  ema:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build candidate from authoritative immutable READY checkpoint
        run: python src/publish_ema_state.py
      - name: Validate READY lineage and promote shared adjusted EMA state
        run: python src/verify_ema_equivalence.py --sample-size 50

  downstream:
    needs: ema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit recorded earnings freshness for active compliant universe
        run: python src/audit_screening_freshness.py --snapshot-date current
      - name: Write durable full-production completion evidence
        run: python src/production_completion.py --write

  dispatch-pattern-breakout:
    needs: downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch Pattern Breakout current READY signals
        env:
          GH_TOKEN: ${{ secrets.PATTERN_BREAKOUT_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing PATTERN_BREAKOUT_DISPATCH_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azharmz/ussy-pattern-breakout/actions/workflows/daily-signals.yml/dispatches \
            -d '{"ref":"main"}'

  dispatch-trendfoll:
    needs: downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: identity
        name: Read authoritative completed production identity
        run: python src/production_completion.py --dispatch-identity
      - name: Dispatch exact production identity to TrendFoll
        env:
          GH_TOKEN: ${{ secrets.TRENDFOLL_DISPATCH_TOKEN }}
          COMPLETION_KEY: ${{ steps.identity.outputs.completion_key }}
          COMPLETION_SHA256: ${{ steps.identity.outputs.completion_sha256 }}
          READY_AS_OF_DATE: ${{ steps.identity.outputs.ready_as_of_date }}
          READY_PARQUET_KEY: ${{ steps.identity.outputs.ready_parquet_key }}
          READY_SHA256: ${{ steps.identity.outputs.ready_sha256 }}
          EMA_PARQUET_KEY: ${{ steps.identity.outputs.ema_parquet_key }}
          EMA_SHA256: ${{ steps.identity.outputs.ema_sha256 }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing TRENDFOLL_DISPATCH_TOKEN"; exit 1; }
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "upstream_completion_key": os.environ["COMPLETION_KEY"],
                  "upstream_completion_sha256": os.environ["COMPLETION_SHA256"],
                  "upstream_ready_as_of_date": os.environ["READY_AS_OF_DATE"],
                  "upstream_ready_parquet_key": os.environ["READY_PARQUET_KEY"],
                  "upstream_ready_sha256": os.environ["READY_SHA256"],
                  "upstream_ema_parquet_key": os.environ["EMA_PARQUET_KEY"],
                  "upstream_ema_sha256": os.environ["EMA_SHA256"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azharmz/ussy-trendfoll/actions/workflows/daily.yml/dispatches \
            -d "$payload"

