name: Production EMA resume

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/publish_ema_state.py'
      - 'src/verify_ema_equivalence.py'
      - 'src/ema_state.py'
      - 'src/load_ema_state.py'
      - 'src/ema_promotion.py'
      - 'tests/test_ema_state.py'
      - 'tests/test_publish_ema_state.py'
      - 'tests/test_verify_ema_equivalence.py'
      - 'tests/test_history_namespace_contract.py'

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests before consuming READY checkpoint
        run: python -m unittest discover -s tests

  ema:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build candidate from authoritative immutable READY checkpoint
        run: python src/publish_ema_state.py
      - name: Validate READY lineage and promote shared adjusted EMA state
        run: python src/verify_ema_equivalence.py --sample-size 50

  downstream:
    needs: ema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit recorded earnings freshness for active compliant universe
        run: python src/audit_screening_freshness.py --snapshot-date current
      - name: Publish read-only web status
        run: python src/publish_web_status.py
