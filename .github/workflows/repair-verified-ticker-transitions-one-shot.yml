name: Repair verified ticker transitions one-shot
on:
  push:
    branches: [main]
    paths:
      - "src/repair_verified_ticker_transitions.py"
      - "tests/test_repair_verified_ticker_transitions.py"
      - ".github/workflows/repair-verified-ticker-transitions-one-shot.yml"
permissions:
  contents: read
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate transition contract
        run: python -m unittest tests.test_repair_verified_ticker_transitions
      - name: Repair three same-security histories
        run: python src/repair_verified_ticker_transitions.py
