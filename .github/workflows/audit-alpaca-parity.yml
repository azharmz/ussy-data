name: Audit Alpaca adjusted-bar parity

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Missing canonical session to probe
        required: true
        default: "2026-09-22"
      sample_size:
        description: Bounded number of affected symbols
        required: true
        default: "50"

permissions:
  contents: read

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests for parity probe
        run: python -m unittest tests.test_alpaca_parity_probe
      - name: Require Alpaca credentials
        run: |
          test -n "$ALPACA_API_KEY_ID" || { echo "::error::Missing ALPACA_API_KEY_ID"; exit 1; }
          test -n "$ALPACA_API_SECRET_KEY" || { echo "::error::Missing ALPACA_API_SECRET_KEY"; exit 1; }
      - name: Compare Alpaca SIP adjusted bars with canonical READY
        run: python src/audit_alpaca_parity.py --target-date "${{ inputs.target_date }}" --sample-size "${{ inputs.sample_size }}"
