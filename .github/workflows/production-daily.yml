name: Production daily OHLCV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-daily.yml'
      - 'src/update_production.py'
      - 'src/export_ready.py'
      - 'src/audit_screening_freshness.py'
      - 'src/publish_web_status.py'

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

jobs:
  production-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Onboard missing full histories for new universe members
        run: python src/bootstrap_missing_ohlcv.py
      - name: Update daily and rolling OHLCV
        run: python src/update_production.py
      - name: Export ready-only strategy data
        run: python src/export_ready.py
      - name: Build non-production EMA candidate
        run: python src/publish_ema_state.py
      - name: Validate and promote shared EMA state
        run: python src/verify_ema_equivalence.py --all-if-bootstrap --sample-size 50
      - name: Audit recorded earnings freshness for active compliant universe
        run: python src/audit_screening_freshness.py
      - name: Publish read-only web status
        run: python src/publish_web_status.py
