name: Production daily OHLCV

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Active Musaffa membership snapshot date or current
        required: true
        default: "current"
      request_delay:
        description: Delay between Yahoo batches in seconds
        required: true
        default: "2.0"
      batch_size:
        description: Yahoo tickers per controlled batch
        required: true
        default: "10"
  push:
    branches: [dispatch/recover-21sep-production]
    paths: [.github/dispatch/recover-21sep-production]
  schedule:
    # 05:07 UTC = 13:07 WITA. Well after the prior regular US close + 90m buffer.
    - cron: "7 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_STORAGE_WARN_GIB: "7"
  R2_STORAGE_HARD_STOP_GIB: "9"
  PYTHONUNBUFFERED: "1"

jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      complete: ${{ steps.guard.outputs.complete }}
      stage: ${{ steps.guard.outputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: guard
        name: Check durable full-production completion
        run: python src/production_completion.py --check

  preflight:
    needs: completion
    if: needs.completion.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Guard shared R2 bucket before writes
        run: python src/r2_storage_guard.py

  ohlcv:
    needs: [completion, preflight]
    if: needs.completion.outputs.stage == 'ohlcv'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Onboard missing full histories for new universe members
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date || 'current' }}
        run: python src/bootstrap_missing_ohlcv.py --snapshot-date "${SNAPSHOT_DATE}" --max-new-members 50 --max-retries 3 --request-delay 2.0
      - name: Update finalized daily and rolling OHLCV
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date || 'current' }}
          REQUEST_DELAY: ${{ inputs.request_delay || '2.0' }}
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: python src/run_production_finalized.py --snapshot-date "${SNAPSHOT_DATE}" --rolling-bars 300 --minimum-ready-bars 250 --batch-size "${BATCH_SIZE}" --request-delay "${REQUEST_DELAY}"

  ready:
    needs: [completion, preflight, ohlcv]
    if: always() && needs.preflight.result == 'success' && needs.completion.outputs.stage == 'ohlcv' && needs.ohlcv.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Export immutable READY and advance READY pointer
        run: python src/export_ready.py

  ema:
    needs: [completion, preflight, ready]
    if: always() && needs.preflight.result == 'success' && ((needs.completion.outputs.stage == 'ohlcv' && needs.ready.result == 'success') || needs.completion.outputs.stage == 'ema')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build non-production adjusted EMA candidate from current READY checkpoint
        run: python src/publish_ema_state.py
      - name: Validate and promote shared adjusted EMA state
        run: python src/verify_ema_equivalence.py --sample-size 50

  downstream:
    needs: [completion, preflight, ema]
    if: always() && needs.preflight.result == 'success' && ((needs.completion.outputs.stage == 'ohlcv' && needs.ema.result == 'success') || (needs.completion.outputs.stage == 'ema' && needs.ema.result == 'success') || needs.completion.outputs.stage == 'downstream')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit recorded earnings freshness for active compliant universe
        run: python src/audit_screening_freshness.py --snapshot-date current
      - name: Publish read-only web status
        run: python src/publish_web_status.py
      - name: Write durable full-production completion evidence
        run: python src/production_completion.py --write

  dispatch-pattern-breakout:
    needs: [completion, downstream]
    if: always() && needs.downstream.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch Pattern Breakout current READY signals
        env:
          GH_TOKEN: ${{ secrets.PATTERN_BREAKOUT_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing PATTERN_BREAKOUT_DISPATCH_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azharmz/ussy-pattern-breakout/actions/workflows/daily-signals.yml/dispatches \
            -d '{"ref":"main"}'

  dispatch-trendfoll:
    needs: [completion, downstream]
    if: always() && needs.downstream.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: identity
        name: Read authoritative completed production identity
        run: python src/production_completion.py --dispatch-identity
      - name: Dispatch exact production identity to TrendFoll
        env:
          GH_TOKEN: ${{ secrets.TRENDFOLL_DISPATCH_TOKEN }}
          COMPLETION_KEY: ${{ steps.identity.outputs.completion_key }}
          COMPLETION_SHA256: ${{ steps.identity.outputs.completion_sha256 }}
          READY_AS_OF_DATE: ${{ steps.identity.outputs.ready_as_of_date }}
          READY_PARQUET_KEY: ${{ steps.identity.outputs.ready_parquet_key }}
          READY_SHA256: ${{ steps.identity.outputs.ready_sha256 }}
          EMA_PARQUET_KEY: ${{ steps.identity.outputs.ema_parquet_key }}
          EMA_SHA256: ${{ steps.identity.outputs.ema_sha256 }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing TRENDFOLL_DISPATCH_TOKEN"; exit 1; }
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "upstream_completion_key": os.environ["COMPLETION_KEY"],
                  "upstream_completion_sha256": os.environ["COMPLETION_SHA256"],
                  "upstream_ready_as_of_date": os.environ["READY_AS_OF_DATE"],
                  "upstream_ready_parquet_key": os.environ["READY_PARQUET_KEY"],
                  "upstream_ready_sha256": os.environ["READY_SHA256"],
                  "upstream_ema_parquet_key": os.environ["EMA_PARQUET_KEY"],
                  "upstream_ema_sha256": os.environ["EMA_SHA256"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azharmz/ussy-trendfoll/actions/workflows/daily.yml/dispatches \
            -d "$payload"
