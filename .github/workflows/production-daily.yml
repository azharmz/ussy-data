name: Production daily OHLCV

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Active Musaffa membership snapshot date or current
        required: true
        default: "current"
      request_delay:
        description: Delay between Yahoo batches in seconds
        required: true
        default: "10.0"
      batch_size:
        description: Yahoo tickers per controlled batch
        required: true
        default: "10"
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update daily and rolling OHLCV
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date || 'current' }}
          REQUEST_DELAY: ${{ inputs.request_delay || '10.0' }}
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: |
          python src/update_production.py \
            --snapshot-date "${SNAPSHOT_DATE}" \
            --rolling-bars 300 \
            --minimum-ready-bars 250 \
            --batch-size "${BATCH_SIZE}" \
            --request-delay "${REQUEST_DELAY}"

      - name: Export ready-only strategy data
        run: python src/export_ready.py

      - name: Audit recorded earnings freshness for active compliant universe
        run: python src/audit_screening_freshness.py --snapshot-date current

      - name: Publish read-only web status
        run: python src/publish_web_status.py

