name: Corporate action source-role evaluation
on:
  push:
    branches: [main]
    paths:
      - '.github/run-corporate-action-source-role-evaluation'
permissions:
  contents: read
env:
  TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compare Yahoo primary acquisition candidate against Tiingo independent validation
        run: python src/evaluate_split_source_roles.py
