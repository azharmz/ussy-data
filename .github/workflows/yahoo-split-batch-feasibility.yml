name: Yahoo split batch feasibility
on:
  push:
    branches: [main]
    paths:
      - '.github/run-yahoo-split-batch-feasibility'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe Yahoo split events in one batched download
        run: python src/probe_yahoo_split_batch.py
