name: Diagnose NPO OHLC (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preserve R2 evidence and refetch only NPO
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PYTHONUNBUFFERED: '1'
        run: python src/diagnose_npo.py
      - name: Upload audit evidence even on diagnostic failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npo-ohlc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/npo/
          retention-days: 30
          if-no-files-found: warn
