name: Bootstrap all remaining OHLCV

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Musaffa membership snapshot date (YYYY-MM-DD)
        required: true
        default: "2026-08-28"
      start_index:
        description: First unprocessed row in confirmed-compliant membership
        required: true
        default: "98"
      total_count:
        description: Confirmed-compliant membership count
        required: true
        default: "1087"
      batch_size:
        description: Securities per batch
        required: true
        default: "25"
      request_delay:
        description: Delay between Yahoo tickers in seconds
        required: true
        default: "3.0"

permissions:
  contents: read

concurrency:
  group: ohlcv-bootstrap-all
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      starts: ${{ steps.matrix.outputs.starts }}
    steps:
      - name: Build batch matrix
        id: matrix
        shell: bash
        env:
          START_INDEX: ${{ inputs.start_index }}
          TOTAL_COUNT: ${{ inputs.total_count }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python - <<'PY'
          import json
          import os

          start = int(os.environ["START_INDEX"])
          total = int(os.environ["TOTAL_COUNT"])
          size = int(os.environ["BATCH_SIZE"])
          if start < 0 or total <= start or not 1 <= size <= 100:
              raise SystemExit("Invalid start_index, total_count, or batch_size")
          starts = list(range(start, total, size))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"starts={json.dumps(starts, separators=(',', ':'))}\n")
          print(f"Prepared {len(starts)} batches covering rows {start}..{total - 1}")
          PY

  bootstrap:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        start_index: ${{ fromJSON(needs.prepare.outputs.starts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Bootstrap OHLCV batch
        shell: bash
        run: |
          python src/bootstrap_ohlcv.py \
            --snapshot-date "${{ inputs.snapshot_date }}" \
            --start-index "${{ matrix.start_index }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --request-delay "${{ inputs.request_delay }}"
