name: Cleanup retired broad-market membership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-retired-broad-market-membership.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3
      - name: Delete only retired #53 namespace and verify empty
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          prefix = 'market/membership/'
          bucket = os.environ['R2_BUCKET_NAME']
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['R2_ENDPOINT'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto',
              config=Config(retries={'max_attempts': 5, 'mode': 'adaptive'}),
          )

          paginator = s3.get_paginator('list_objects_v2')
          keys = []
          for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
              keys.extend(obj['Key'] for obj in page.get('Contents', []))

          print(f'Found {len(keys)} object(s) under {prefix}')
          for i in range(0, len(keys), 1000):
              batch = keys[i:i+1000]
              if batch:
                  resp = s3.delete_objects(
                      Bucket=bucket,
                      Delete={'Objects': [{'Key': key} for key in batch], 'Quiet': False},
                  )
                  errors = resp.get('Errors', [])
                  if errors:
                      raise RuntimeError(f'R2 deletion errors: {errors}')

          remaining = []
          for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
              remaining.extend(obj['Key'] for obj in page.get('Contents', []))

          if remaining:
              raise RuntimeError(f'Cleanup verification failed; {len(remaining)} object(s) remain: {remaining[:20]}')

          print(f'Cleanup verified: 0 objects remain under {prefix}')
          PY
