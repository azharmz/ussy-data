name: Publish broad-market membership

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-broad-market-membership.yml'
      - 'src/publish_broad_market_membership.py'
      - 'tests/test_broad_market_membership_publisher.py'

permissions:
  contents: read

concurrency:
  group: publish-broad-market-membership
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and pytest
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install pytest
      - name: Run #53 semantic tests
        run: python -m pytest -q tests/test_broad_market_membership_publisher.py
      - name: Publish immutable broad-market membership snapshot
        run: python src/publish_broad_market_membership.py
