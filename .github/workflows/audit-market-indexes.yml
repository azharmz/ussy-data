name: Major index source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/audit_market_indexes.py'
      - 'docs/MARKET_INDEX_SOURCE_AUDIT_V1.md'
      - '.github/workflows/audit-market-indexes.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run major-index source audit
        run: python src/audit_market_indexes.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: major-index-source-audit-${{ github.run_id }}
          path: diagnostics/market-index-source-audit/
          retention-days: 30
