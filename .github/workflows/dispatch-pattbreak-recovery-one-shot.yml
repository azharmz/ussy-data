name: Dispatch Pattern Breakout after recovered READY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-pattbreak-recovery-one-shot.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch current completed READY to canonical Pattern Breakout repository
        env:
          GH_TOKEN: ${{ secrets.PATTERN_BREAKOUT_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing PATTERN_BREAKOUT_DISPATCH_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azharmz/ussy-pattbreak/actions/workflows/daily-signals.yml/dispatches \
            -d '{"ref":"main"}'
