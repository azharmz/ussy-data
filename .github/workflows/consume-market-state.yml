name: Production market state

on:
  workflow_dispatch:
  schedule:
    # Run after the daily major-index publisher so candidate generation cannot inherit stale M state.
    - cron: "50 4 * * 1-5"
  push:
    branches: [main]
    paths:
      - 'src/consume_market_state.py'
      - '.github/workflows/consume-market-state.yml'

permissions:
  contents: read

concurrency:
  group: production-market-state
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CANSLIM_RESEARCH_PATH: canslim-research/src
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout data infrastructure
        uses: actions/checkout@v7
      - name: Checkout frozen CAN SLIM research classifier
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-canslim-research
          path: canslim-research
          ref: cc20bdfb35433b5afacf2d8a51ee56acc76b682e
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assert frozen classifier contract
        run: |
          PYTHONPATH=canslim-research/src python - <<'PY'
          from canslim_research.market_state_v1 import VERSION
          assert VERSION == '46-market-state-classification-v1', VERSION
          PY
      - name: Resolve #49 pointer, verify lineage, run frozen #46, publish PIT state
        run: python src/consume_market_state.py
