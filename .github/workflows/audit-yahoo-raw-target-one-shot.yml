name: Audit Yahoo raw target row one-shot
on:
  push:
    paths:
      - ".github/workflows/audit-yahoo-raw-target-one-shot.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect raw Yahoo shape for AAPL
        run: |
          python - <<'PY'
          import pandas as pd, yfinance as yf
          from src.repair_yahoo_session_gap import extract, raw_target_session
          raw=yf.download(["AAPL","MSFT"],start="2026-09-21",end="2026-09-23",interval="1d",auto_adjust=False,actions=False,progress=False,group_by="ticker",threads=False)
          one=extract(raw,"AAPL",2)
          sel=raw_target_session(one,pd.Timestamp("2026-09-22"))
          print("RAW_COLUMNS",repr(one.columns.tolist()))
          print("RAW_INDEX",repr(one.index.tolist()))
          print("SELECTED_INDEX",repr(sel.index.tolist()))
          print("SELECTED_DTYPES",repr(sel.dtypes.astype(str).to_dict()))
          print("SELECTED_VALUES",repr(sel.to_dict("records")))
          PY
