name: Audit R2 inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-r2-inventory.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit entire R2 bucket (read-only)
        run: python src/audit_r2_inventory.py
      - name: Inspect production daily 2026-09-22 (read-only)
        run: |
          python - <<'PY'
          import io, os, json
          import pandas as pd
          from src.bootstrap_ohlcv import make_s3_client

          key = "production/daily/2026-09-22.parquet"
          s3 = make_s3_client()
          bucket = os.environ["R2_BUCKET_NAME"]
          obj = s3.get_object(Bucket=bucket, Key=key)
          raw = obj["Body"].read()
          df = pd.read_parquet(io.BytesIO(raw))
          sid = df["security_id"].astype(str)
          ticker = df["ticker"].astype(str)
          numeric = ["open","high","low","close","adj_close","volume"]
          nulls = {c:int(df[c].isna().sum()) for c in numeric if c in df.columns}
          dup_sid = int(sid.duplicated().sum())
          azn = df.loc[ticker.eq("AZN")].copy()
          for c in azn.columns:
              if pd.api.types.is_datetime64_any_dtype(azn[c]):
                  azn[c] = azn[c].astype(str)
          report = {
              "mode":"READ_ONLY",
              "key":key,
              "bytes":len(raw),
              "rows":len(df),
              "unique_security_ids":int(sid.nunique()),
              "unique_tickers":int(ticker.nunique()),
              "duplicate_security_ids":dup_sid,
              "null_ohlcv":nulls,
              "date_counts":df["date"].astype(str).value_counts().to_dict() if "date" in df.columns else {},
              "azn":azn.to_dict(orient="records"),
          }
          print("DAILY_2026_09_22_AUDIT="+json.dumps(report,default=str,sort_keys=True),flush=True)
          PY

      - name: Check 17 unresolved Stooq securities in canonical history (read-only)
        run: |
          python - <<'PY'
          import json, os
          from botocore.exceptions import ClientError
          from src.bootstrap_ohlcv import make_s3_client
          targets = [
              ("US45828L1089","IAS"),("US6793691089","OLPX"),("US05350V1061","AVNS"),
              ("US87427V1035","TALK"),("VGG205281089","MCTA"),("US45769N1054","ISSC"),
              ("US2274831047","CCRN"),("IL0010828585","WILC"),("KYG712641086","PLTS"),
              ("KYG3139J1094","EFTY"),("US4628371050","UCFI"),("KYG57Y0E1004","MAGH"),
              ("VGG6053R1064","MAMK"),("KYG722282012","PC"),("US68840D1028","OSRH"),
              ("US37892C1062","GGRP"),("US0554742090","SLAI"),
          ]
          s3=make_s3_client(); bucket=os.environ["R2_BUCKET_NAME"]
          rows=[]
          for sid,ticker in targets:
              key=f"history/ohlcv/{sid}.parquet"
              try:
                  h=s3.head_object(Bucket=bucket,Key=key)
                  rows.append({"ticker":ticker,"security_id":sid,"exists":True,"key":key,"bytes":int(h.get("ContentLength",0))})
              except ClientError as e:
                  code=str(e.response.get("Error",{}).get("Code",""))
                  if code in {"404","NoSuchKey","NotFound"}:
                      rows.append({"ticker":ticker,"security_id":sid,"exists":False,"key":key})
                  else:
                      raise
          print("STOOQ_17_CANONICAL_HISTORY="+json.dumps({"exists":sum(r["exists"] for r in rows),"missing":sum(not r["exists"] for r in rows),"rows":rows},sort_keys=True),flush=True)
          PY
