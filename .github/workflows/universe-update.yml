name: Update Musaffa universe

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Snapshot date or latest complete file set
        required: true
        default: "latest"
  push:
    branches:
      - main
    paths:
      - "universe/musaffa_snapshot_*.json"
      - "universe/musaffa_security_master_*.json"
      - "universe/musaffa_membership_*.json"

permissions:
  contents: read

concurrency:
  group: universe-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate, publish, and compare universe
        id: universe
        env:
          REQUESTED_DATE: ${{ inputs.snapshot_date || 'latest' }}
        run: python src/update_universe.py --snapshot-date "${REQUESTED_DATE}"

      - name: Audit screening freshness against earnings dates
        run: python src/audit_screening_freshness.py --snapshot-date "${{ steps.universe.outputs.snapshot_date }}"

      - name: Bootstrap ADDED securities
        run: python src/bootstrap_added.py --snapshot-date "${{ steps.universe.outputs.snapshot_date }}" --request-delay 3.0

      - name: Rebuild rolling for active membership
        run: |
          python src/build_rolling.py \
            --snapshot-date "${{ steps.universe.outputs.snapshot_date }}" \
            --rolling-bars 300 \
            --minimum-ready-bars 250

      - name: Export ready-only strategy data
        run: python src/export_ready.py

