name: Sep21 canonical coverage audit
on:
  workflow_dispatch:
  push:
    paths:
      - "src/audit_sep21_coverage.py"
      - ".github/workflows/audit-sep21-coverage.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Count Sep21 canonical coverage
        run: python src/audit_sep21_coverage.py
