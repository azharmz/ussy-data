name: Audit Sep14 OHLCV Repair

on:
  push:
    branches: [main]
    paths:
      - 'src/repair_partial_daily_bar.py'
      - 'tests/test_provider_symbols.py'
      - '.github/workflows/audit-repair-sep14-ohlcv.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Audit Sep 14 finalized bars (no writes)
        run: python src/repair_partial_daily_bar.py --date 2026-09-14
