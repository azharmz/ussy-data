name: Audit Sep14 OHLCV Repair

on:
  push:
    branches: [main]
    paths:
      - 'src/repair_partial_daily_bar.py'
      - 'tests/test_provider_symbols.py'
      - '.github/workflows/audit-repair-sep14-ohlcv.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Read Sep14 audit evidence (no writes)
        run: |
          python - <<'PY'
          import json, os
          from bootstrap_ohlcv import make_s3_client
          key = 'audit/ohlcv-repair/2026-09-14/run-35063409654-1.json'
          s3 = make_s3_client()
          report = json.loads(s3.get_object(Bucket=os.environ['R2_BUCKET_NAME'], Key=key)['Body'].read())
          print(json.dumps(report, indent=2))
          PY
