name: Audit OHLCV bootstrap

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Musaffa membership snapshot date (YYYY-MM-DD)
        required: true
        default: "2026-08-28"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check boto3

      - name: Audit bootstrap and write repair queue
        run: python src/audit_bootstrap.py --snapshot-date "${{ inputs.snapshot_date }}"

