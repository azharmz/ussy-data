name: Repair Yahoo session gap one-shot
on:
  push:
    paths:
      - "src/repair_yahoo_session_gap.py"
      - "tests/test_repair_yahoo_session_gap.py"
      - ".github/workflows/repair-yahoo-session-gap-one-shot.yml"
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt scipy
      - name: Test targeted repair
        run: python -m unittest tests.test_repair_yahoo_session_gap
      - name: Audit Sep 22 Yahoo availability (no R2 writes)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python - <<'PY'
          import yfinance as yf
          import pandas as pd
          ticker="AZN"
          start="2026-09-21"
          end="2026-09-25"
          print("=== yf.download RAW AZN ===")
          d=yf.download(ticker,start=start,end=end,interval="1d",auto_adjust=False,actions=False,progress=False,group_by="ticker",threads=False)
          print("index:", repr(d.index))
          print(d.to_string())
          print("=== Ticker.history RAW AZN repair=False ===")
          h=yf.Ticker(ticker).history(start=start,end=end,interval="1d",auto_adjust=False,actions=False,repair=False)
          print("index:", repr(h.index))
          print(h.to_string())
          print("=== Ticker.history RAW AZN repair=True ===")
          hr=yf.Ticker(ticker).history(start=start,end=end,interval="1d",auto_adjust=False,actions=False,repair=True)
          print("index:", repr(hr.index))
          print(hr.to_string())
          PY
