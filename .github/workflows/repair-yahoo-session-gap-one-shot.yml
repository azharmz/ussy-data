name: Repair Yahoo session gap one-shot 
on:
  push:
    paths:
      - "src/repair_yahoo_session_gap.py"
      - "tests/test_repair_yahoo_session_gap.py"
      - ".github/workflows/repair-yahoo-session-gap-one-shot.yml"
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt scipy
      - name: Test targeted repair
        run: python -m unittest tests.test_repair_yahoo_session_gap
      - name: Repair Sep 22 histories from Yahoo
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python src/repair_yahoo_session_gap.py --target-date 2026-09-22 --batch-size 25 --max-batches 4
