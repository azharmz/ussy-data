name: R2 storage monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - 'src/publish_r2_storage_status.py'
      - 'src/r2_storage_guard.py'
      - 'tests/test_r2_storage_status.py'
      - 'web/r2/index.html'
      - '.github/workflows/r2-storage-monitor.yml'

permissions:
  contents: write

concurrency:
  group: r2-storage-monitor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_STORAGE_WARN_GIB: "7"
      R2_STORAGE_HARD_STOP_GIB: "9"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run R2 monitor tests
        run: python -m unittest tests.test_r2_storage_guard tests.test_r2_storage_status
      - name: Build canonical R2 storage status
        run: python src/publish_r2_storage_status.py --local-output web/r2/status.json
      - name: Publish static Pages feed
        shell: bash
        run: |
          if git diff --quiet -- web/r2/status.json; then
            echo "No monitor feed change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/r2/status.json
          git commit -m "Update R2 storage monitor status [skip ci]"
          git push origin HEAD:main
