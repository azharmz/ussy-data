name: Prepare isolated CCTG repair bundle

on:
  workflow_dispatch:
  push:
    branches: [repair/cctg-ema-isolated-bundle]
    paths:
      - ".github/workflows/prepare-cctg-repair-bundle.yml"
      - "src/prepare_cctg_repair_bundle.py"
      - "tests/test_prepare_cctg_repair_bundle.py"

permissions:
  contents: read

concurrency:
  group: cctg-repair-bundle
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_prepare_cctg_repair_bundle.py'
      - name: Build local-only backup and candidate bundle
        run: python src/prepare_cctg_repair_bundle.py --output-dir artifacts/cctg-repair-bundle
      - name: Upload review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: cctg-repair-bundle
          path: artifacts/cctg-repair-bundle/
          if-no-files-found: error
          retention-days: 30
