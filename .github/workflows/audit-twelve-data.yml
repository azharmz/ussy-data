name: Audit Twelve Data fallback (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twelve-data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Compare six symbols without production access
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python src/audit_twelve_data.py
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twelve-data-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/twelve-data/
          retention-days: 30
          if-no-files-found: warn
