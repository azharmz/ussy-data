name: Bootstrap reviewed tickers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-daily
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Bootstrap reviewed queue (Yahoo downloads)
        run: python src/bootstrap_policy.py
      - name: Rebuild rolling and readiness from R2
        run: python src/rebuild_compliance.py
      - name: Export ready-only strategy data
        run: python src/export_ready.py
      - name: Audit recorded earnings freshness
        run: python src/audit_screening_freshness.py --snapshot-date current
      - name: Publish web status
        run: python src/publish_web_status.py
