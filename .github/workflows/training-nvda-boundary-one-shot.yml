name: Training NVDA boundary audit one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/training-nvda-boundary-one-shot.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -q -r requirements.txt
      - run: |
          git clone -q https://github.com/azharmz/ussy-oneil-patterns.git /tmp/oneil
          git -C /tmp/oneil checkout -q c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - name: Audit NVDA July-Oct 2025 candidate boundaries
        env: {PYTHONPATH: '/tmp/oneil/src'}
        run: |
          python - <<'PY'
          import io,json,os
          import boto3,pandas as pd
          from botocore.config import Config
          from oneil_patterns.landmarks.excursion import extract_excursion_landmarks
          from oneil_patterns.landmarks.confirmed_window import extract_confirmed_window_landmarks
          from oneil_patterns.landmarks.fusion import fuse_landmark_sources
          from oneil_patterns.validation.structural_assembly import assemble_multiturn_segments
          from oneil_patterns.morphology.cup_body import build_cup_body_geometry
          from oneil_patterns.morphology.cup_body_detector import assess_cup_body
          s3=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",config=Config(retries={"max_attempts":5,"mode":"adaptive"}));b=os.environ["R2_BUCKET_NAME"]
          cur=json.loads(s3.get_object(Bucket=b,Key="universe/current.json")["Body"].read()); snap=cur["snapshot_date"]; mem=json.loads(s3.get_object(Bucket=b,Key=f"universe/membership/{snap}.json")["Body"].read())["records"]; sid=[x["security_id"] for x in mem if str(x.get("ticker","")).upper()=="NVDA"][0]
          f=pd.read_parquet(io.BytesIO(s3.get_object(Bucket=b,Key=f"history/ohlcv/{sid}.parquet")["Body"].read())).sort_values("date").reset_index(drop=True);f["date"]=pd.to_datetime(f.date); w=f[(f.date>=pd.Timestamp("2025-06-01"))&(f.date<=pd.Timestamp("2025-10-20"))].reset_index(drop=True); asof=w.date.max().date()
          p=extract_excursion_landmarks(w); a=extract_confirmed_window_landmarks(w); lm=fuse_landmark_sources(w,p,a); lm=[x for x in lm if x.confirmed_date<=asof]
          print("P1/FUSED LANDMARKS")
          for x in lm: print(x.type.value,x.price_date,round(x.price,4),x.confirmed_date,x.method)
          print("MULTITURN CUP CANDIDATES ending Sep-Oct")
          for s in assemble_multiturn_segments(w,lm,asof_date=asof):
            if not s.recovery or s.recovery.price_date < pd.Timestamp("2025-09-01").date(): continue
            g=build_cup_body_geometry(w,s.start,s.trough,s.recovery); z=assess_cup_body(g)
            print(json.dumps({"left":str(g.left_rim.price_date),"left_px":g.left_rim.price,"low":str(g.trough.price_date),"low_px":g.trough.price,"right":str(g.right_rim.price_date),"right_px":g.right_rim.price,"duration":g.duration_sessions,"depth":g.depth_pct,"recovery_ratio":g.right_rim_to_left_rim_ratio,"state":z.state.value,"faults":[q.value for q in z.faults]}))
          PY
