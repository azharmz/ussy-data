name: Corporate action bounded R2 pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/run-corporate-action-bounded-pilot'
permissions:
  contents: read
env:
  TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Guard shared R2 bucket before pilot writes
        env:
          R2_STORAGE_WARN_GIB: '7'
          R2_STORAGE_HARD_STOP_GIB: '9'
        run: python src/r2_storage_guard.py
      - name: Publish and read-back bounded pilot
        run: python src/publish_corporate_action_split_pilot.py
