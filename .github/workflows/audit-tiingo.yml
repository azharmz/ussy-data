name: Audit Tiingo fallback (read-only)
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tiingo-data-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Compare Tiingo and Yahoo
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python src/audit_tiingo.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiingo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/tiingo-data/
          retention-days: 30
          if-no-files-found: warn
